[project]
name = "lec-ai-agent"
version = "0.1.0"
description = "A secure agent that consumes, validates, and executes tasks from an untrusted warehouse feed."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
# This lets you run the agent with: uv run lec-agent
lec-agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell hatchling our source package is the `agent/` directory
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

